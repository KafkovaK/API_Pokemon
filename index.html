<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>POKEPEDIA</title>
    <link rel="stylesheet" href="styles.css" />
    <link rel="icon" type="image" href="https://i.pinimg.com/1200x/3a/6b/bc/3a6bbc84a841a889356e1f0d6ee5ba4e.jpg">
</head>
<body>
<div id="overlay" class="overlay" onclick="closeCard()"></div>

<header class="header">
    <h3>POKEPEDIA</h3>

    <div class="hamburger" onclick="toggleMenu()">☰</div>

    <nav class="nav-links" id="navMenu">
        <a href="index.html">HOME</a>
        <a href="about.html">ABOUT</a>
        <a href="apps.html">APPS</a>
    </nav>
</header>


<main>
    <div class="filters">
        <label for="abilityFilter">Filter by ability:</label>
        <select id="abilityFilter">
            <option value="">All abilities</option>
        </select>
    </div>

    <div class="filters">
        <input
                type="text"
                id="searchInput"
                placeholder="Search Pokémon..."
        />
    </div>

    <div id="pokemon-card" class="card-container"></div>
</main>


<div id="pokemon-modal" class="modal hidden">
    <div class="modal-content">
        <span class="close">&times;</span>
        <div id="modal-body"></div>
    </div>
</div>


<script src="data.js"></script>

</body>
</html>
